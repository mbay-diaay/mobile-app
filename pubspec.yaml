name: mbay_diaay
description: Mbay Diaay · application technicien (Flutter + GetX), d'après la maquette v2.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  camera: ^0.12.0+2
  flutter:
    sdk: flutter
  geolocator: ^14.1.2
  get: ^4.6.6
  http: ^1.2.2
  image_picker: ^1.2.4
  maps_toolkit: ^3.1.0
  material_symbols_icons: ^4.2800.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Polices embarquées (variables) : l'app fonctionne sans réseau dès le 1er lancement.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
