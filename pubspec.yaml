name: mbay_diaay
description: Mbay Diaay · application technicien (Flutter + GetX), d'après la maquette v2.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  camera: ^0.12.0+2
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.2
  get: ^4.6.6
  http: ^1.2.2
  image_picker: ^1.2.4
  maps_toolkit: ^3.1.0
  material_symbols_icons: ^4.2800.0
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.6
  sqlite3_flutter_libs: ^0.5.28
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.15
  drift_dev: ^2.26.0
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter


flutter:
  uses-material-design: true

  # Polices embarquées (variables) : l'app fonctionne sans réseau dès le 1er lancement.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
