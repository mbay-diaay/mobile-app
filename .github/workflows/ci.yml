name: CI Mobile

on:
  push:
    branches: [main, master, 'chore/**', 'fix/**', 'feat/**']
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze lib
      - run: flutter test
